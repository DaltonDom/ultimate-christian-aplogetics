  - id: romans-road
    title: The Romans Road
    time: "5–10 minutes"
    bestFor: "People open to reading the Bible with you, or a friend who wants to see it for themselves. Easy to remember and easy to pass on."
    summary: >-
      A classic path through five verses in Paul's letter to the Romans. It works best
      when you add the Law (so “all have sinned” becomes personal) and when you clearly
      explain repentance alongside faith.
    steps:
      - title: Open the Bible together
        say: "Can I show you how the Bible explains the good news? It's all in one book — Romans. Would you read along with me?"
        tip: "If possible, let them read the verses aloud. Scripture carries its own weight."
      - title: Everyone has sinned (Romans 3:23)
        say: >-
          Paul says all have sinned and fall short of God's glory. Let's make that
          personal for a second — have you ever lied? Ever taken something that wasn't
          yours? Jesus said lust is adultery of the heart. So how are we doing against
          God's standard?
        tip: "Adding the Law here (Romans 3:19-20; 7:7) is what turns a general truth into a personal one. Without it, people nod along without feeling any need."
      - title: Sin pays a wage (Romans 6:23a)
        say: "Look at the first half: the wages of sin is death. Like a paycheck — it's what we've earned. And the Bible says that means more than physical death; it means being separated from God forever."
      - title: God's gift (Romans 6:23b)
        say: "But the second half flips it: the free gift of God is eternal life in Christ Jesus. You can't earn a gift. You can only receive it."
      - title: God's love at the cross (Romans 5:8)
        say: "God showed His love this way — while we were still sinners, Christ died for us. He didn't wait for us to get our act together. He took our punishment on the cross, and He rose again."
      - title: Confess and believe (Romans 10:9-10)
        say: >-
          So how do we receive it? Paul says to confess with your mouth that Jesus is Lord
          and believe in your heart that God raised Him from the dead. Calling Jesus
          'Lord' means He's in charge now — which is why the Bible also calls it
          repentance: turning from sin to Him.
        tip: "Don't skip repentance (Acts 17:30; Romans 2:4). “Jesus is Lord” is a surrender, not just a sentence to say."
      - title: A promise for anyone (Romans 10:13)
        say: "And here's the promise: everyone who calls on the name of the Lord will be saved. Everyone. That includes you. Is there anything stopping you from turning to Him today?"
        tip: "If they're ready, encourage them to pray to God in their own words. If not, give them a Bible and suggest they start in the Gospel of John."
    verses: [Romans 3:23, Romans 3:19-20, Romans 7:7, Romans 6:23, Romans 5:8, Romans 10:9-10, Romans 10:13, Romans 2:4, Acts 17:30]

