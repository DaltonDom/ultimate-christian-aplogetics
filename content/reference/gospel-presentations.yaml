  - id: sharing-your-testimony
    title: Sharing Your Testimony
    time: "2–4 minutes"
    bestFor: "Friends, family, and coworkers who know you — or anyone who asks, “Why are you a Christian?” A story is hard to argue with."
    summary: >-
      A simple three-part story — before, how you met Christ, and after — told so that it
      lands on the gospel and on Jesus, not on you. Write it down, trim it, and practise
      it until it fits in about three minutes.
    steps:
      - title: Know your goal
        say: "Can I tell you how I came to faith? It's kind of the most important thing that's ever happened to me."
        tip: "Your story is the doorway, not the destination. The aim is to show them Jesus, not to impress them with your past or your present."
      - title: Before
        say: >-
          Before I became a Christian, I thought I was a pretty decent person. I believed
          in God in a vague way, but I lived how I wanted. What I was really trusting in
          was ... [my own goodness / my career / being liked / partying — be specific and
          honest].
        tip: "Be honest but not graphic. Don't glamourise sin. If you grew up in church, your “before” might be relying on church instead of Christ — that's a real story too."
      - title: How I met Christ
        say: >-
          Then ... [what happened]. I came to see that I'd broken God's commandments —
          I'd lied, I'd been selfish, I'd ignored Him — and that I was guilty before Him.
          But I learned that Jesus died on the cross to pay for exactly those sins, and
          rose again. I turned from my sin and put my trust in Him.
        tip: "This is where the gospel lives in your story. Include sin, the cross, the resurrection, and repentance and faith — in your own words."
      - title: After
        say: >-
          Since then, I'm not perfect — far from it. But I know I'm forgiven, I'm not
          afraid of death anymore, and I actually want to do what's right now. God has
          changed what I love.
        tip: "Be realistic. Don't promise that Jesus fixes every problem; talk about the real change — forgiveness, peace with God, new desires."
      - title: Turn it towards them
        say: "Can I ask — has anything like that ever happened to you? Where would you say you are with God right now?"
        tip: "Now listen. Their answer tells you where to go next — often into the Good Person Test."
      - title: Land on the gospel
        say: >-
          The amazing thing is, it's not about me. What Jesus did for me, He offers to
          anyone. Every one of us has sinned, but He paid the penalty in full. If you turn
          from your sin and trust Him, He'll forgive you too.
        tip: "Finish on Christ, not on yourself. Invite them to respond, and offer to read the Bible with them."
    verses: [1 Peter 3:15, Acts 26:9-23, John 9:25, Mark 5:19, 1 Timothy 1:15-16, 2 Corinthians 5:17]
