  - id: sixty-second-gospel
    title: The 60-Second Gospel
    time: "About 1 minute"
    bestFor: "When you only have a moment — an elevator ride, a checkout line, a taxi, the end of a phone call."
    summary: >-
      The whole message in five quick beats: God, sin, the cross, the response, and a
      next step. Practise it out loud until you can say it naturally in about a minute.
    steps:
      - title: A quick opener
        say: "Can I tell you the best news I've ever heard? It'll take about a minute."
        tip: "If they say no, smile and respect it. If they say yes, keep your promise — one minute."
      - title: God and His standard
        say: "God made us, and He's perfectly good. His standard is the Ten Commandments — don't lie, don't steal, don't even lust in your heart."
      - title: Our problem
        say: "If we're honest, we've all broken those. That makes us guilty before God, and the Bible says one day we'll face Him on Judgment Day."
      - title: God's rescue
        say: "But God loves us. Jesus — God in human flesh — died on the cross to pay the penalty for our sins, and three days later He rose from the dead."
      - title: The response
        say: "So God calls us to repent — turn from our sin — and trust Jesus alone to save us. Not our good deeds. Just Him. Here's something to read when you've got a minute."
        tip: "Hand them a tract or tell them where to start reading (the Gospel of John). Leave something they can take with them."
    verses: [Romans 3:23, Hebrews 9:27, Romans 5:8, 1 Corinthians 15:3-4, Mark 1:15]

