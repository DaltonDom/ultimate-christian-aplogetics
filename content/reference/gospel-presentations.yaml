  # ---------------------------------------------------------------------------
  - id: good-person-test
    title: The Good Person Test
    time: "5–10 minutes"
    bestFor: "Anyone who thinks they're basically a good person — which is almost everyone. Works on the street, at work, and with family."
    summary: >-
      Popularised by Ray Comfort and the Living Waters team, this approach uses a few of
      the Ten Commandments to help a person see their sin for themselves, lets their
      conscience give the verdict, and then brings them to the cross and a call to repent
      and trust Christ.
    steps:
      - title: Ask the question
        say: "Can I ask you something? Do you think you're a good person — like, on the whole?"
        tip: "Almost everyone says yes. Don't argue. Just say, “Let's see,” and move on warmly."
      - title: Hold up the mirror
        say: >-
          Let's look at a few of the Ten Commandments. Have you ever told a lie — even a
          small one? … Ever taken something that wasn't yours, whatever it was worth? …
          Ever used God's name as a swear word? … Jesus said that looking at someone with
          lust is adultery in the heart. Have you ever done that?
        tip: "Ask, don't accuse. Let them answer each one. Keep your tone kind and your own guilt in view — you'd fail this test too."
      - title: Let the conscience speak
        say: >-
          So, by your own admission, you've lied, stolen, blasphemed, and committed
          adultery in your heart. I'm not judging you — I've done the same. But if God
          judged you by that standard on Judgment Day, would you be innocent or guilty?
        tip: "Stop and let them answer. Their conscience already agrees with the Law — you're just giving it a voice."
      - title: Heaven or hell?
        say: "If you're guilty, would you go to heaven or hell? … Does that concern you?"
        tip: "If they say “God will forgive me because He's good,” explain that a good judge can't just let guilty people go free. That's exactly what makes the cross necessary."
      - title: The cross
        say: >-
          Here's the good news. God doesn't want you to go to hell. Jesus — God in human
          flesh — lived the perfect life we haven't, and on the cross He took the
          punishment for our sins. It's like you broke the law, and someone else paid your
          fine. Then He rose from the dead, defeating death.
        tip: "Slow down here. This is the moment the whole conversation has been building towards."
      - title: Repent and trust
        say: >-
          So what do you need to do? Two things the Bible says go together: repent — turn
          away from your sin, not just feel bad about it — and trust Jesus alone to save
          you, like you'd trust a parachute to save you when you jump. Not your good
          deeds. Him.
        tip: "Don't pressure anyone into a prayer. Point them to God, not to a formula."
      - title: Point them onward
        say: "Would you think about this seriously? Start reading the Gospel of John and ask God to show you the truth. Is anything stopping you from turning to Him today?"
        tip: "Thank them for their time. Offer a Bible, a tract, or a way to follow up if they're open."
    verses: [Romans 3:19-20, Exodus 20:1-17, Matthew 5:27-28, Romans 2:14-15, Hebrews 9:27, Romans 5:8, 2 Corinthians 5:21, Mark 1:15, Acts 20:21]

  # ---------------------------------------------------------------------------
  - id: the-courtroom
    title: The Courtroom
    time: "3–5 minutes"
    bestFor: "People who ask “Why did Jesus have to die?” or think God should just forgive everyone. Great for thinkers and anyone who values justice."
    summary: >-
      One illustration that carries the whole gospel: a guilty criminal, a good judge who
      can't look the other way, a fine that can't be paid — and someone who pays it for
      them. Use it on its own or as the bridge to the cross in any other presentation.
    steps:
      - title: Set the scene
        say: >-
          Picture this. You're standing in a courtroom. You've broken the law — seriously
          — and the evidence is overwhelming. There's video. There's no question you're
          guilty.
      - title: The judge must be just
        say: >-
          Now, suppose you say to the judge, 'I'm sorry, and I've done lots of good things
          too.' Should a good judge just let you go? … No. If he did, he'd be a corrupt
          judge. A good judge has to see that justice is done.
        tip: "This answers the common objection “Why can't God just forgive?” before it comes up."
      - title: The fine you can't pay
        say: >-
          So the judge sets the fine — and it's millions. You don't have anything close.
          You're going to prison, and you've got no one to blame but yourself.
      - title: Someone pays
        say: >-
          Then someone you don't even deserve help from walks in and pays the whole fine.
          The judge says, 'The fine has been paid. You're free to go.' The law is
          satisfied, and you walk out. That's justice and mercy at the same time.
      - title: Here's the real story
        say: >-
          That's what God did. We've all broken His Law — lying, stealing, lust, putting
          other things ahead of Him. We're guilty. But Jesus, God in human flesh, came and
          paid our fine with His own life on the cross. Then He rose from the dead. And
          here's the part that amazes me: in God's courtroom, the Judge Himself is the one
          who stepped down and paid.
        tip: "Every illustration has limits. This one works because the payment is a legal one — the Bible calls it a substitute taking our penalty."
      - title: What you do with it
        say: >-
          But you have to respond. God commands us to repent — turn from our sin — and
          put our trust in Jesus. It's not a free pass to keep breaking the law; it's a
          new start with a new heart. Would you want that?
    verses: [Romans 3:23, Romans 6:23, Romans 3:26, 2 Corinthians 5:21, 1 Peter 3:18, Isaiah 53:5-6, Acts 17:30-31]

